name: Build OrangeFox Recovery (HWDBY)

# 云端编译：不需要本机 Linux / 不需要 BIOS 虚拟化 / 不占用本地磁盘。
# 仓库里只需要两个文件：
#   1) .github/workflows/build_ofox.yml   (本文件)
#   2) HWDBY_device_tree.zip              (设备树，21.6 MB)
#
# v3 (crypto 修正版):
#   * 安卓 11 的 fscrypt 策略是 **v1**，TWRP 不显式设 TW_USE_FSCRYPT_POLICY 时会按 v2 编，
#     密钥/策略结构对不上 => 解密必失败。本版强制 TW_USE_FSCRYPT_POLICY := 1。
#   * 老树的 fscrypt Android.mk 里没有 twrpfbe 模块（产物里只有 fscryptpolicyget/keystore_auth），
#     本版自动把 twrpfbe 模块补进去并单独编译，同时把运行所需的库/二进制打成 crypto-run.tgz。
#
# 清单：https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
# 分支：twrp-11 / twrp-12.1 / twrp-14.1

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源码清单种类（保持 twrp 即可）'
        required: true
        default: 'twrp'
        type: choice
        options: [twrp, orangefox]
      branch:
        description: '安卓版本（11 / 12.1 / 14.1）'
        required: true
        default: '12.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            fontconfig python3 python-is-python3 bc rsync ccache libssl-dev device-tree-compiler
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 解压设备树
        run: |
          ls -l
          rm -rf "$HOME/devtree" && mkdir -p "$HOME/devtree"
          if [ -f HWDBY_device_tree.zip ]; then
            unzip -q HWDBY_device_tree.zip -d "$HOME/devtree"
          else
            mkdir -p "$HOME/devtree/device"
            cp -a device/huawei "$HOME/devtree/device/" 2>/dev/null || true
          fi
          find "$HOME/devtree" -maxdepth 3 -type d | sort
          ls -l "$HOME/devtree/device/huawei/HWDBY"

      - name: dump 设备树里的 crypto 配置
        run: |
          echo "===== BoardConfig.mk crypto 行 ====="
          grep -n -i -E "crypto|fbe|fscrypt|keymaster|keystore" "$HOME/devtree/device/huawei/HWDBY/BoardConfig.mk" || echo "(none)"
          echo "===== recovery.fstab /data 行 ====="
          grep -n "/data" "$HOME/devtree/device/huawei/HWDBY/recovery.fstab" || true

      - name: 同步源码
        env:
          SRC: ${{ inputs.source }}
          BR: ${{ inputs.branch }}
        run: |
          set -e
          if [ "$SRC" = "orangefox" ]; then
            MANIFEST="https://gitlab.com/OrangeFox/Manifest.git"
            case "$BR" in
              11|11.0|android-11|default)   BR="default" ;;
              16|16.0|fox_16.0)             BR="fox_16.0" ;;
              9|9.0|fox_9.0)                BR="fox_9.0" ;;
            esac
          else
            MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
            case "$BR" in
              11|11.0|android-11|twrp-11)   BR="twrp-11" ;;
              12|12.1|android-12.1)         BR="twrp-12.1" ;;
              14|14.1|android-14.1)         BR="twrp-14.1" ;;
            esac
          fi
          echo "manifest=$MANIFEST branch=$BR"
          git config --global user.name  "ci-builder"
          git config --global user.email "ci@local"
          mkdir -p "$HOME/tree" && cd "$HOME/tree"
          repo init --depth=1 -u "$MANIFEST" -b "$BR"
          repo sync -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags
          echo "===== fscrypt 目录 ====="
          ls bootable/recovery/crypto 2>/dev/null || true
          find bootable/recovery -path '*fscrypt*' -name 'Android.mk' 2>/dev/null || true

      - name: 放入设备树
        run: |
          cp -a "$HOME/devtree/device/huawei" "$HOME/tree/device/"
          ls -l "$HOME/tree/device/huawei/HWDBY"

      - name: 修正 crypto 旗标（安卓11 必须 fscrypt V1）并补 twrpfbe 模块
        run: |
          set -e
          cd "$HOME/tree"
          B=device/huawei/HWDBY/BoardConfig.mk
          grep -q 'TW_INCLUDE_CRYPTO' "$B" || echo 'TW_INCLUDE_CRYPTO := true' >> "$B"
          grep -q 'TW_INCLUDE_FBE'    "$B" || echo 'TW_INCLUDE_FBE := true' >> "$B"
          if ! grep -q 'TW_USE_FSCRYPT_POLICY' "$B"; then
            {
              echo ''
              echo '# HWDBY: 安卓11(sdk30) 用 fscrypt 策略 v1；不设的话 TWRP 按 v2 编，解密必失败'
              echo 'TW_USE_FSCRYPT_POLICY := 1'
            } >> "$B"
          fi
          echo "===== 修正后的 crypto 旗标 ====="
          grep -n -E 'TW_INCLUDE_CRYPTO|TW_INCLUDE_FBE|TW_USE_FSCRYPT_POLICY' "$B"

          M=$(find bootable/recovery -path '*fscrypt*' -name 'Android.mk' | head -1)
          echo "fscrypt Android.mk = $M"
          if [ -n "$M" ]; then
            echo "===== 现有模块 ====="
            grep -n 'LOCAL_MODULE' "$M" || true
            echo "===== 目录 ====="
            ls -l "$(dirname "$M")" | head -40
            if ! grep -q 'twrpfbe' "$M"; then
              python3 - "$M" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8', errors='replace').read()
          block = '''
          include $(CLEAR_VARS)
          LOCAL_MODULE := twrpfbe
          LOCAL_MODULE_TAGS := optional
          LOCAL_MODULE_CLASS := RECOVERY_EXECUTABLES
          LOCAL_MODULE_PATH := $(TARGET_RECOVERY_ROOT_OUT)/system/bin
          LOCAL_SRC_FILES := main.cpp
          LOCAL_SHARED_LIBRARIES := libtwrpfscrypt
          include $(BUILD_EXECUTABLE)

          '''
          if s.rstrip().endswith('endif'):
              i = s.rstrip().rfind('endif')
              s = s[:i] + block + s[i:]
          else:
              s = s + block
          open(p, 'w', encoding='utf-8').write(s)
          print('twrpfbe 模块已写入')
          PYEOF
            fi
            echo "===== 追加后的尾部 ====="
            tail -25 "$M"
          else
            echo "!! 没找到 fscrypt 的 Android.mk，列一下候选目录"
            find bootable/recovery -maxdepth 3 -type d | head -40
          fi

      - name: 给 recovery 域补 SELinux 权限（TWRP 必须能读 /data/unencrypted）
        run: |
          set -e
          cd "$HOME/tree"
          F="system/sepolicy/private/recovery.te"
          if [ -f "$F" ]; then
            {
              echo ''
              echo '# ==== HWDBY: 让 TWRP 的 recovery 域能读 /data/unencrypted (FBE 的 DE 密钥) ===='
              echo 'allow recovery unencrypted_data_file:dir { getattr search open read };'
              echo 'allow recovery unencrypted_data_file:file { getattr open read map };'
              echo 'allow recovery unencrypted_data_file:lnk_file { getattr read };'
              echo '# ==== HWDBY: recovery 域访问 TEE (keymaster wrappedkey) ===='
              echo 'allow recovery tee_device:chr_file { open read write ioctl getattr map };'
              echo '# ==== HWDBY: recovery 域当 keymaster 的 HAL client ===='
              echo 'hal_client_domain(recovery, hal_keymaster)'
            } >> "$F"
            echo "===== patched $F ====="
            tail -15 "$F"
          else
            echo "!! 找不到 $F"
            ls system/sepolicy 2>/dev/null | head -30
          fi

      - name: 编译 recovery.img + twrpfbe
        run: |
          set -o pipefail
          cd "$HOME/tree"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch orangefox_HWDBY-eng
          mka recoveryimage twrpfbe -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== 产物 ==="
          ls -l out/target/product/HWDBY/recovery.img || true
          ls -l out/target/product/HWDBY/recovery/root/system/bin/twrpfbe || true

      - name: 校验产物确实带 crypto
        if: always()
        run: |
          cd "$HOME/tree" || exit 0
          {
            echo "=== recovery 二进制里的 crypto 痕迹 ==="
            for f in $(find out/target/product/HWDBY -type f -name recovery 2>/dev/null | head -5); do
              echo "--- $f"
              strings -a "$f" | grep -n -E "File Based Encryption is present|Keymaster_Ver|TW_INCLUDE_CRYPTO" | head -10 || true
            done
            echo "=== ramdisk 里的 crypto 文件 ==="
            ls out/target/product/HWDBY/recovery/root/system/bin 2>/dev/null | grep -i -E "keystore|fscrypt|twrpfbe" || true
            echo "=== twrpfbe 详情 ==="
            ls -l out/target/product/HWDBY/recovery/root/system/bin/twrpfbe 2>/dev/null || echo "(没有 twrpfbe)"
            echo "=== 是否用了 fscrypt V1 ==="
            strings -a out/target/product/HWDBY/recovery/root/system/lib64/libtwrpfscrypt.so 2>/dev/null | grep -i -E "fscrypt_policy_v1|fscrypt_policy_v2|V1|V2" | head -10 || true
          } 2>&1 | tee "$GITHUB_WORKSPACE/crypto-check.log"

      - name: 打包 crypto 运行文件（twrpfbe + 库 + 关键二进制）
        if: always()
        run: |
          cd "$HOME/tree" || exit 0
          R=out/target/product/HWDBY/recovery/root
          W="$GITHUB_WORKSPACE/crypto-run"
          rm -rf "$W"; mkdir -p "$W/system/bin" "$W/system/lib64"
          for b in recovery keystore keystore_auth twrpfbe fscryptpolicyget keystore_cli_v2 linker64; do
            if [ -f "$R/system/bin/$b" ]; then cp -a "$R/system/bin/$b" "$W/system/bin/"; fi
          done
          cp -a "$R/system/lib64/." "$W/system/lib64/" 2>/dev/null || true
          cp -a "$R/etc/recovery.fstab" "$W/recovery.fstab" 2>/dev/null || true
          cp -a "$R/system/etc/ld.config.txt" "$W/ld.config.txt" 2>/dev/null || true
          echo "=== bin ==="; ls -l "$W/system/bin" || true
          echo "=== lib64 数量 ==="; ls "$W/system/lib64" | wc -l || true
          (cd "$GITHUB_WORKSPACE" && tar -czf crypto-run.tgz crypto-run) || true
          ls -l "$GITHUB_WORKSPACE/crypto-run.tgz" || true

      - name: 上传编译日志（失败时也能看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            crypto-check.log
          if-no-files-found: warn

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-HWDBY
          path: |
            ~/tree/out/target/product/HWDBY/recovery.img
            ~/tree/out/target/product/HWDBY/ramdisk-recovery.img
            ~/tree/out/target/product/HWDBY/kernel
            crypto-run.tgz
          if-no-files-found: warn
