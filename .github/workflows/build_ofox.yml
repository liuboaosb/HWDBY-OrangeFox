name: Build OrangeFox Recovery (HWDBY)

# 云端编译：不需要本机 Linux / 不需要 BIOS 虚拟化 / 不占用本地磁盘
# 仓库里只需要两个文件：
#   1) .github/workflows/build_ofox.yml   (本文件)
#   2) HWDBY_device_tree.zip              (设备树，21.6 MB，网页可直接上传)
# 用法：Actions → Build OrangeFox Recovery (HWDBY) → Run workflow → 等编译完成 → 下载 Artifacts

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源码清单: orangefox 或 twrp'
        required: true
        default: 'orangefox'
        type: choice
        options: [orangefox, twrp]
      branch:
        description: '分支（orangefox 建议 11.0；twrp 建议 android-11）'
        required: true
        default: '11.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            fontconfig python3 python-is-python3 bc rsync ccache libssl-dev device-tree-compiler
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 解压设备树
        run: |
          ls -l
          rm -rf "$HOME/devtree" && mkdir -p "$HOME/devtree"
          if [ -f HWDBY_device_tree.zip ]; then
            unzip -q HWDBY_device_tree.zip -d "$HOME/devtree"
          else
            # 若已经解压成 device/ 目录放在仓库里，也支持
            mkdir -p "$HOME/devtree/device"
            cp -a device/huawei "$HOME/devtree/device/" 2>/dev/null || true
          fi
          find "$HOME/devtree" -maxdepth 3 -type d | sort
          ls -l "$HOME/devtree/device/huawei/HWDBY"
          ls -l "$HOME/devtree/device/huawei/HWDBY/prebuilt"

      - name: 同步源码
        env:
          SRC: ${{ inputs.source }}
          BR: ${{ inputs.branch }}
        run: |
          set -e
          if [ "$SRC" = "orangefox" ]; then
            MANIFEST="https://gitlab.com/OrangeFox/sync.git"
          else
            MANIFEST="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
          fi
          echo "manifest=$MANIFEST branch=$BR"
          git config --global user.name  "ci-builder"
          git config --global user.email "ci@local"
          mkdir -p "$HOME/tree" && cd "$HOME/tree"
          repo init --depth=1 -u "$MANIFEST" -b "$BR"
          repo sync -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

      - name: 放入设备树
        run: |
          cp -a "$HOME/devtree/device/huawei" "$HOME/tree/device/"
          ls -l "$HOME/tree/device/huawei/HWDBY"

      - name: 编译 recovery.img
        run: |
          set -o pipefail
          cd "$HOME/tree"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch orangefox_HWDBY-eng
          mka recoveryimage -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ls -l out/target/product/HWDBY/recovery.img

      - name: 上传编译日志（失败时也能看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 上传 recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: recovery-HWDBY
          path: ~/tree/out/target/product/HWDBY/recovery.img
